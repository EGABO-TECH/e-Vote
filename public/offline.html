<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1d4ed8">
    <title>Offline · e-Vote</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f8faff; color: #0a0f1e; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 32px; border: 1px solid #e2e8f0; border-radius: 14px; background: #fff; text-align: center; box-shadow: 0 12px 36px rgba(7, 16, 42, .08); }
      img { width: 68px; height: 68px; object-fit: contain; margin: 0 auto 18px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0; color: #526078; }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/e-Vote-Logo.png" alt="e-Vote">
      <h1>You are offline</h1>
      <p>Reconnect to continue. For ballot security, election pages are not stored for offline access.</p>
    </main>
  </body>
</html>
